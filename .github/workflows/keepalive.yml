name: Keep Streamlit App Awake

# Streamlit Community Cloud は一定時間アクセスがないとスリープする。
# 単純なHTTP pingでは起きないため、Playwrightで実際にアプリを開き、
# スリープ画面が出ていれば起こすボタンを自動クリックして起こす。
# スリープ画面を検出したのに起こせない場合は exit 1 で失敗扱いにし、緑のまま見逃さない。

on:
  schedule:
    - cron: "0 */4 * * *"   # 4時間ごと（UTC）。間隔を変えたい場合はここを編集。
  workflow_dispatch:          # 手動実行も可能

# 同時実行を防ぐ
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: アプリを起こす
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright をインストール
        run: |
          pip install --quiet "playwright>=1.40,<2.0"
          python -m playwright install chromium

      - name: アプリを開いて起こす
        env:
          APP_URL: "https://kakeizu-navi-3joa5l78sjkams2axwbxix.streamlit.app/"
        run: |
          python - <<'PY'
          import os, sys, time
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          SLEEP_MARKERS = ["get this app back up", "is sleeping", "gone to sleep", "Zzzz"]
          WAKE_SELECTORS = [
              'button:has-text("get this app back up")',
              'button:has-text("Yes, get this app back up")',
              'text=get this app back up',
          ]

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              time.sleep(5)

              # スリープ画面か明示的に判定（テキストマーカー）
              sleep_detected = False
              for m in SLEEP_MARKERS:
                  try:
                      if page.get_by_text(m, exact=False).count() > 0:
                          sleep_detected = True
                          break
                  except Exception:
                      pass

              woke = False
              if sleep_detected:
                  print("スリープ画面を検出 → 起こすボタンを探索")
                  for sel in WAKE_SELECTORS:
                      try:
                          btn = page.locator(sel)
                          if btn.count() > 0:
                              btn.first.click(timeout=5000)
                              woke = True
                              print("起こすボタンをクリックしました")
                              break
                      except Exception:
                          pass
                  if not woke:
                      # スリープ画面はあるのに押せない＝セレクタ陳腐化等。緑のまま見逃さない
                      print("::error::スリープ画面を検出したが起こすボタンをクリックできませんでした（keepalive.yml のセレクタ更新が必要な可能性）")
                      browser.close()
                      sys.exit(1)
                  time.sleep(40)
              else:
                  print("スリープ画面なし（アプリは起動中）")

              # Streamlit本体の読み込み確認
              loaded = False
              try:
                  page.wait_for_selector('[data-testid="stApp"], .stApp, #root', timeout=30000)
                  loaded = True
                  print("Streamlitアプリの読み込みを確認")
              except Exception:
                  print("（stApp 読み込み確認はタイムアウト）")

              browser.close()

          # 起こしたのに本体確認に失敗＝起動失敗の可能性。失敗扱い
          if woke and not loaded:
              print("::error::起こした後に Streamlit 本体の読み込みを確認できませんでした")
              sys.exit(1)
          print("keep-alive 完了")
          PY

      - name: 失敗時サマリー
        if: failure()
        run: |
          {
            echo "## ❌ keep-alive 失敗"
            echo ""
            echo "アプリを起こせなかった可能性があります（スリープ画面セレクタの陳腐化／タイムアウト等）。"
            echo "**対処**: アプリURLを直接開き、必要なら Manage app → Reboot app。"
            echo "スリープ画面の文言が変わっている場合は keepalive.yml の WAKE_SELECTORS / SLEEP_MARKERS を更新してください。"
          } >> "$GITHUB_STEP_SUMMARY"
