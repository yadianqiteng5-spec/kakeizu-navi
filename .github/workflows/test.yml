name: Tests & Precision Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎月1日に税制改正等の変更を早期検知するため定期実行
    - cron: '0 0 1 * *'

jobs:
  test:
    name: 法律・税額計算の精度検証
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 全テスト実行（pytest）
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

      - name: 国税庁公表値との厳密一致検証
        run: |
          python -X utf8 tests/test_precision_regression.py
        env:
          PYTHONIOENCODING: utf-8

      - name: ヒアリング→家系図組立の回帰検証
        run: |
          python -X utf8 tests/test_hearing.py
        env:
          PYTHONIOENCODING: utf-8

      - name: テスト結果サマリー（成功時）
        if: success()
        run: |
          {
            echo "## ✅ 全テスト合格"
            echo ""
            echo "| 項目 | 結果 |"
            echo "|---|---|"
            echo "| Python | ${{ matrix.python-version }} |"
            echo "| 単体テスト（pytest） | 全通過 |"
            echo "| 精度リグレッション | 国税庁公表値と一致 |"
            echo "| ヒアリング回帰 | 全通過 |"
            echo ""
            echo "🌳 デプロイ可能な状態です。"
          } >> $GITHUB_STEP_SUMMARY

      - name: テスト失敗時の通知
        if: failure()
        run: |
          {
            echo "## ❌ テスト失敗"
            echo ""
            echo "計算精度・法律ロジックに問題が検出されました。"
            echo "コミット内容を確認してください。"
            echo ""
            echo "**確認手順:**"
            echo '1. ローカルで `python -X utf8 tests/test_inheritance.py` を実行'
            echo '2. `python -X utf8 tests/test_precision_regression.py` で精度確認'
            echo "3. 失敗ケースを修正してから再プッシュ"
          } >> $GITHUB_STEP_SUMMARY
          echo "::error::計算精度の検証に失敗しました。デプロイを中止してください。"
          exit 1

  lint:
    name: コード品質チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python構文チェック
        run: |
          python -m compileall core/ tests/ app.py
