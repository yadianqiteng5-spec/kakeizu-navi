name: Tests & Precision Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 毎月1日に税制改正等の変更を早期検知するため定期実行
    - cron: '0 0 1 * *'

jobs:
  test:
    name: 法律・税額計算の精度検証
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Python ${{ matrix.python-version }} セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: 全テスト実行（pytest）
        run: |
          python -m pytest tests/ -v --tb=short
        env:
          PYTHONIOENCODING: utf-8

      - name: 国税庁公表値との厳密一致検証
        run: |
          python -X utf8 tests/test_precision_regression.py
        env:
          PYTHONIOENCODING: utf-8

      - name: テスト結果サマリー（成功時）
        if: success()
        run: |
          {
            echo "## ✅ 全テスト合格"
            echo ""
            echo "| 項目 | 結果 |"
            echo "|---|---|"
            echo "| Python | ${{ matrix.python-version }} |"
            echo "| 単体テスト | 39ケース全通過 |"
            echo "| 精度リグレッション | 国税庁公表値と一致 |"
            echo "| AIバリデーション | 9ケース全通過 |"
            echo ""
            echo "🌳 デプロイ可能な状態です。"
          } >> $GITHUB_STEP_SUMMARY

      - name: テスト失敗時の通知
        if: failure()
        run: |
          {
            echo "## ❌ テスト失敗"
            echo ""
            echo "計算精度・法律ロジックに問題が検出されました。"
            echo "コミット内容を確認してください。"
            echo ""
            echo "**確認手順:**"
            echo '1. ローカルで `python -X utf8 tests/test_inheritance.py` を実行'
            echo '2. `python -X utf8 tests/test_precision_regression.py` で精度確認'
            echo "3. 失敗ケースを修正してから再プッシュ"
          } >> $GITHUB_STEP_SUMMARY
          echo "::error::計算精度の検証に失敗しました。デプロイを中止してください。"
          exit 1

  lint:
    name: コード品質チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python構文チェック
        run: |
          python -m compileall core/ tests/ app.py

  notify:
    name: 結果通知
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()
    steps:
      - name: 通知ペイロード作成
        id: payload
        run: |
          if [ "${{ needs.test.result }}" = "success" ] && [ "${{ needs.lint.result }}" = "success" ]; then
            STATUS="✅ 成功"
            COLOR="good"
            HEX="3FB950"
          else
            STATUS="❌ 失敗"
            COLOR="danger"
            HEX="F85149"
          fi
          echo "status=$STATUS" >> $GITHUB_OUTPUT
          echo "color=$COLOR"   >> $GITHUB_OUTPUT
          echo "hex=$HEX"       >> $GITHUB_OUTPUT
          echo "commit_msg=$(git log -1 --pretty=%s 2>/dev/null || echo '${{ github.event.head_commit.message }}')" >> $GITHUB_OUTPUT

      # ── Slack通知（オプション: Secrets に SLACK_WEBHOOK_URL を設定すると有効化）──
      - name: Slack通知
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data "{
              \"attachments\": [{
                \"color\": \"${{ steps.payload.outputs.color }}\",
                \"title\": \"🌳 家系図Navi CI: ${{ steps.payload.outputs.status }}\",
                \"text\": \"コミット: ${{ steps.payload.outputs.commit_msg }}\",
                \"fields\": [
                  {\"title\": \"テスト\", \"value\": \"${{ needs.test.result }}\", \"short\": true},
                  {\"title\": \"Lint\", \"value\": \"${{ needs.lint.result }}\", \"short\": true}
                ],
                \"actions\": [{
                  \"type\": \"button\",
                  \"text\": \"詳細ログを見る\",
                  \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                }]
              }]
            }" \
            "$SLACK_WEBHOOK_URL"

      # ── Discord通知（オプション: Secrets に DISCORD_WEBHOOK_URL を設定すると有効化）──
      - name: Discord通知
        if: env.DISCORD_WEBHOOK_URL != ''
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            --data "{
              \"embeds\": [{
                \"title\": \"🌳 家系図Navi CI: ${{ steps.payload.outputs.status }}\",
                \"description\": \"コミット: ${{ steps.payload.outputs.commit_msg }}\",
                \"color\": $(printf '%d' 0x${{ steps.payload.outputs.hex }}),
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
                \"fields\": [
                  {\"name\": \"テスト\", \"value\": \"${{ needs.test.result }}\", \"inline\": true},
                  {\"name\": \"Lint\", \"value\": \"${{ needs.lint.result }}\", \"inline\": true}
                ]
              }]
            }" \
            "$DISCORD_WEBHOOK_URL"

      # ── 失敗時はGitHub Issue自動作成（メール通知が標準で飛ぶ）──
      - name: 失敗時に自動Issue作成
        if: needs.test.result == 'failure' || needs.lint.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `🚨 CI失敗: ${context.payload.head_commit?.message?.split('\n')[0] || context.sha.substring(0,7)}`;
            const body = `## CI実行が失敗しました\n\n` +
              `- **コミット**: ${context.sha}\n` +
              `- **テスト結果**: ${{ needs.test.result }}\n` +
              `- **Lint結果**: ${{ needs.lint.result }}\n` +
              `- **詳細**: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\n` +
              `### 確認手順\n` +
              `1. ローカルで \`python -X utf8 tests/test_inheritance.py\` を実行\n` +
              `2. \`python -X utf8 tests/test_precision_regression.py\` で精度確認\n` +
              `3. 失敗ケースを修正してから再プッシュ\n`;
            // 同じタイトルの未解決Issueがあれば作らない
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci-failure',
            });
            if (!issues.data.some(i => i.title === title)) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ci-failure', 'automated'],
              });
            }
