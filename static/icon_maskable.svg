<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- PWA maskable icon: 安全領域は中央80% (51-461) -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27AE60"/>
      <stop offset="100%" stop-color="#16A085"/>
    </linearGradient>
  </defs>
  <!-- 全面塗りつぶし -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- アイコン本体は中央70%に収める -->
  <g transform="translate(76 76) scale(0.7)">
    <!-- 木の幹 -->
    <rect x="240" y="340" width="32" height="100" rx="6" fill="#8B5A2B"/>
    <!-- 樹冠 -->
    <circle cx="256" cy="200" r="100" fill="#2ECC71" opacity="0.85"/>
    <circle cx="180" cy="280" r="80"  fill="#27AE60" opacity="0.85"/>
    <circle cx="332" cy="280" r="80"  fill="#27AE60" opacity="0.85"/>
    <!-- 家系図ノード -->
    <circle cx="256" cy="160" r="22" fill="white"/>
    <circle cx="200" cy="240" r="18" fill="white"/>
    <circle cx="312" cy="240" r="18" fill="white"/>
    <circle cx="170" cy="310" r="14" fill="white"/>
    <circle cx="230" cy="310" r="14" fill="white"/>
    <circle cx="338" cy="310" r="14" fill="white"/>
    <!-- 線 -->
    <line x1="256" y1="160" x2="200" y2="240" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="256" y1="160" x2="312" y2="240" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <line x1="200" y1="240" x2="170" y2="310" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="200" y1="240" x2="230" y2="310" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <line x1="312" y1="240" x2="338" y2="310" stroke="white" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
